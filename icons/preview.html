<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suite Completa - Funciones y Acciones</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card-bg: #ffffff;
      --primary: #c25127;
      --primary-hover: #b0461f;
      --text-main: #2b2825;
      --text-muted: #8b857c;
      --text-btn: #5a544e;
      --border: #e6e0d6;
      --border-hover: #c8c0b2;
      --btn-hover: #f3efe8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .app-container {
      display: flex;
      gap: 32px;
      max-width: 900px;
      width: 100%;
      align-items: flex-start;
    }
    
    /* SIDEBAR FUNCIONES */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #9c958c;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-left: 12px;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 20px 8px 8px 20px;
      font-size: 15px;
      font-weight: 450;
      color: #403b35;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      border: 1px solid transparent;
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke: currentColor;
      flex-shrink: 0;
    }
    .nav-item:hover {
      background: #f0ebe2;
      color: #1a1918;
    }
    .nav-item.active {
      background: var(--primary);
      color: #ffffff;
      font-weight: 500;
      border-radius: 18px;
      box-shadow: 0 4px 12px rgba(194, 81, 39, 0.25);
    }
    .nav-item.active svg {
      stroke: #ffffff;
    }

    /* PANEL ACCIONES */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      width: 320px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.03);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
      padding: 0 12px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text-btn);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn:hover {
      background: var(--btn-hover);
      border-color: var(--border-hover);
      color: #1a1918;
    }
    .btn.full {
      width: 100%;
    }
    .btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
      stroke: currentColor;
      flex-shrink: 0;
    }
    .footer-text {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- SIDEBAR DE FUNCIONES -->
    <div class="sidebar">
      <div class="section-title">Funciones</div>
      <div class="nav-list">
        
        <!-- 1. Ordenar páginas (Activo) -->
        <div class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="10" rx="1.5"/>
            <rect x="13" y="11" width="8" height="10" rx="1.5"/>
            <path d="M14 5h4a2 2 0 0 1 2 2v1"/>
            <polyline points="18 3 20 5 18 7"/>
            <path d="M10 19H6a2 2 0 0 1-2-2v-1"/>
            <polyline points="6 21 4 19 6 17"/>
          </svg>
          <span>Ordenar páginas</span>
        </div>

        <!-- 2. Dividir -->
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"/>
            <path d="M8.12 8.12 12 12"/>
            <path d="M20 4 8.12 15.88"/>
            <circle cx="6" cy="18" r="3"/>
            <path d="M14.8 14.8 20 20"/>
          </svg>
          <span>Dividir</span>
        </div>

        <!-- 3. Unir -->
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 4H5a2 2 0 0 0-2 2v10"/>
            <rect x="8" y="8" width="13" height="13" rx="2"/>
            <line x1="14.5" y1="11.5" x2="14.5" y2="17.5"/>
            <line x1="11.5" y1="14.5" x2="17.5" y2="14.5"/>
          </svg>
          <span>Unir</span>
        </div>

        <!-- 4. Extraer páginas -->
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8l6 6v3"/>
            <polyline points="14 2 14 8 20 8"/>
            <path d="M10 16h11"/>
            <polyline points="18 13 21 16 18 19"/>
          </svg>
          <span>Extraer páginas</span>
        </div>

        <!-- 5. Numerar páginas -->
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="8.5" y1="14" x2="15.5" y2="14"/>
            <line x1="8.5" y1="18" x2="15.5" y2="18"/>
            <line x1="10.5" y1="12" x2="10.5" y2="20"/>
            <line x1="13.5" y1="12" x2="13.5" y2="20"/>
          </svg>
          <span>Numerar páginas</span>
        </div>

        <!-- 6. Comprimir -->
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"/>
            <path d="M12 3v6"/>
            <polyline points="8 6 12 9 16 6"/>
            <path d="M12 21v-6"/>
            <polyline points="8 18 12 15 16 18"/>
          </svg>
          <span>Comprimir</span>
        </div>

        <!-- 7. Convertir -->
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <polyline points="21 3 21 8 16 8"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
            <polyline points="3 21 3 16 8 16"/>
          </svg>
          <span>Convertir</span>
        </div>

        <!-- 8. Proteger -->
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            <circle cx="12" cy="16" r="1"/>
          </svg>
          <span>Proteger</span>
        </div>

      </div>
    </div>

    <!-- PANEL DE ACCIONES -->
    <div class="panel">
      <div class="section-title" style="padding-left:0; color:#b38b4d;">Acciones</div>
      
      <div class="grid">
        <button class="btn" title="Al inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="5" x2="4" y2="19"/>
            <polyline points="12 6 6 12 12 18"/>
            <polyline points="19 6 13 12 19 18"/>
          </svg>
          <span>Al inicio</span>
        </button>

        <button class="btn" title="Antes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="5" x2="6" y2="19"/>
            <polyline points="17 6 10 12 17 18"/>
          </svg>
          <span>Antes</span>
        </button>

        <button class="btn" title="Después">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 6 14 12 7 18"/>
            <line x1="18" y1="5" x2="18" y2="19"/>
          </svg>
          <span>Después</span>
        </button>

        <button class="btn" title="Al final">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="5 6 11 12 5 18"/>
            <polyline points="12 6 18 12 12 18"/>
            <line x1="20" y1="5" x2="20" y2="19"/>
          </svg>
          <span>Al final</span>
        </button>

        <button class="btn" title="Deshacer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14 4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>
          </svg>
          <span>Deshacer</span>
        </button>

        <button class="btn" title="Rehacer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 14 5-5-5-5"/>
            <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/>
          </svg>
          <span>Rehacer</span>
        </button>
      </div>

      <button class="btn full" title="Restaurar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>Restaurar</span>
      </button>

      <div class="footer-text">
        Clic marca una página. Ctrl+clic suma o quita.
      </div>
    </div>

  </div>

</body>
</html>
